# yappfy — Development Override
# Nutzung: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

version: "3.8"

services:
  # Debug-Ports für lokale Entwicklung
  synapse:
    ports:
      - "8008:8008"

  element:
    ports:
      - "8080:80"

  # pgAdmin für DB-Debugging
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yappfy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@yappfy.local
      PGADMIN_DEFAULT_PASSWORD: yappfy
    ports:
      - "5050:80"
