<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yappfy — Deine Messenger. Deine Regeln.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0F0A1A 0%, #1A1228 50%, #0F0A1A 100%);
            color: #F3F0FF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .logo { width: 120px; margin-bottom: 2rem; filter: drop-shadow(0 0 30px rgba(124, 58, 237, 0.5)); }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #7C3AED, #EC4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tagline { font-size: 1.2rem; color: #8B7AA8; margin-bottom: 2rem; }
        .bridges { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; justify-content: center; }
        .bridge { background: #1A1228; border: 1px solid rgba(124, 58, 237, 0.3); border-radius: 12px; padding: 1rem 1.5rem; text-align: center; }
        .bridge .icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .bridge .name { font-weight: bold; }
        .cta { display: inline-block; background: linear-gradient(135deg, #7C3AED, #EC4899); color: white; padding: 0.8rem 2rem; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 1.1rem; transition: transform 0.2s; }
        .cta:hover { transform: scale(1.05); }
        code { background: #1A1228; padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid rgba(124, 58, 237, 0.3); display: block; margin: 1rem auto; max-width: 400px; text-align: left; color: #7C3AED; }
        .footer { margin-top: 3rem; color: #8B7AA8; font-size: 0.9rem; }
        .footer a { color: #7C3AED; text-decoration: none; }
    </style>
</head>
<body>
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
        <rect x="30" y="20" width="140" height="130" rx="30" fill="url(#g)"/>
        <circle cx="80" cy="85" r="12" fill="#7C3AED" stroke="white" stroke-width="2"/>
        <circle cx="100" cy="85" r="12" fill="#0088CC" stroke="white" stroke-width="2"/>
        <circle cx="120" cy="85" r="12" fill="#25D366" stroke="white" stroke-width="2"/>
        <defs>
            <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#7C3AED"/>
                <stop offset="100%" style="stop-color:#EC4899"/>
            </linearGradient>
        </defs>
    </svg>
    
    <h1>yappfy</h1>
    <p class="tagline">Deine Messenger. Deine Regeln.</p>
    
    <div class="bridges">
        <div class="bridge"><div class="icon">💜</div><div class="name">Viber</div></div>
        <div class="bridge"><div class="icon">💙</div><div class="name">Telegram</div></div>
        <div class="bridge"><div class="icon">💚</div><div class="name">WhatsApp</div></div>
    </div>
    
    <p>Alle drei Messenger in <strong>einer</strong> Oberfläche.<br>Self-hosted. Open Source. Kostenlos.</p>
    
    <br>
    
    <code>$ docker compose up</code>
    
    <br>
    
    <a class="cta" href="https://github.com/DEIN_USER/yappfy">⭐ Auf GitHub</a>
    
    <div class="footer">
        AGPL-3.0 · Made with ❤️ in Austria · <a href="https://github.com/DEIN_USER/yappfy">GitHub</a>
    </div>
</body>
</html>
