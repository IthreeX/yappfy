version: "3.8"

# ┌──────────────────────────────────────────────────┐
# │  yappfy — Deine Messenger. Deine Regeln.         │
# │  Viber + Telegram + WhatsApp in einer Oberfläche │
# └──────────────────────────────────────────────────┘

services:
  # ─── Matrix Synapse Server ───
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: yappfy-synapse
    restart: unless-stopped
    volumes:
      - ./config/synapse:/data
      - ./data/synapse/media:/data/media
    environment:
      - SYNAPSE_SERVER_NAME=${DOMAIN:-localhost}
      - SYNAPSE_REPORT_STATS=no
    ports:
      - "8008:8008"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    container_name: yappfy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yappfy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yappfy_secret}
      POSTGRES_DB: synapse
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yappfy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Viber Bridge ───
  mautrix-viber:
    image: ghcr.io/regionallyfamous/mautrix-viber:latest
    container_name: yappfy-viber
    restart: unless-stopped
    volumes:
      - ./config/mautrix-viber:/data
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      synapse:
        condition: service_healthy
    ports:
      - "${VIBER_PORT:-29318}:29318"

  # ─── Telegram Bridge ───
  mautrix-telegram:
    image: dock.mau.dev/mautrix/telegram:latest
    container_name: yappfy-telegram
    restart: unless-stopped
    volumes:
      - ./config/mautrix-telegram:/data
    depends_on:
      synapse:
        condition: service_healthy

  # ─── WhatsApp Bridge ───
  mautrix-whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:latest
    container_name: yappfy-whatsapp
    restart: unless-stopped
    volumes:
      - ./config/mautrix-whatsapp:/data
    depends_on:
      synapse:
        condition: service_healthy

  # ─── Element Web Client ───
  element:
    image: vectorim/element-web:latest
    container_name: yappfy-element
    restart: unless-stopped
    volumes:
      - ./config/element/config.json:/app/config.json:ro
      - ./branding/element:/app/branding:ro
    ports:
      - "${ELEMENT_PORT:-8080}:80"
    depends_on:
      synapse:
        condition: service_healthy

  # ─── Nginx Reverse Proxy ───
  nginx:
    image: nginx:alpine
    container_name: yappfy-nginx
    restart: unless-stopped
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - synapse
      - element

  # ─── Redis (Caching für Bridges) ───
  redis:
    image: redis:7-alpine
    container_name: yappfy-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
