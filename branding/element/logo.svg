<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
  </defs>
  <!-- Chat Bubble Background -->
  <rect x="30" y="20" width="140" height="130" rx="30" fill="url(#grad)" opacity="0.95"/>
  <!-- Bubble tail -->
  <path d="M30,150 Q10,140 25,160 L40,150 Z" fill="url(#grad)" opacity="0.95"/>
  <!-- Three Dots (Viber, Telegram, WhatsApp) -->
  <circle cx="80" cy="85" r="12" fill="#7C3AED" stroke="white" stroke-width="2"/>
  <circle cx="100" cy="85" r="12" fill="#0088CC" stroke="white" stroke-width="2"/>
  <circle cx="120" cy="85" r="12" fill="#25D366" stroke="white" stroke-width="2"/>
  <!-- yappfy text -->
  <text x="100" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#7C3AED">yappfy</text>
</svg>
